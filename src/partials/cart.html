<div class="cart-backdrop" data-cart-close hidden></div>
<aside class="cart-drawer" id="cart-drawer" aria-label="Shopping cart" aria-hidden="true">
  <header class="cart-head">
    <h2>Your Cart <span class="cart-head-count" data-cart-count>0</span></h2>
    <button class="cart-x" type="button" aria-label="Close cart" data-cart-close>✕</button>
  </header>
  <div class="cart-items" data-cart-items></div>
  <p class="cart-empty" data-cart-empty>Your cart is empty. Cove is standing by.</p>
  <footer class="cart-foot">
    <p class="cart-ship" data-cart-ship></p>
    <div class="cart-total"><span>Subtotal</span><strong data-cart-subtotal>$0.00</strong></div>
    <a class="btn btn-primary btn-block" data-link="checkout" href="#">Checkout</a>
    <a class="text-link" href="/products">Continue shopping <span>&rarr;</span></a>
  </footer>
</aside>
<div class="toast" data-toast role="status" aria-live="polite"></div>
