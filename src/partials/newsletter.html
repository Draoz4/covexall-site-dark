<section class="newsletter">
  <div class="container newsletter-inner reveal">
    <img class="nl-cove" src="assets/mk/cove-bottle.webp" alt="" aria-hidden="true">
    <div class="nl-copy">
      <h2>Stay Protected. <span>Stay in the Loop.</span></h2>
      <p>Get tips, new product updates, and special offers—straight to your inbox.</p>
    </div>
    <form class="nl-form" data-form="newsletter">
      <label class="sr-only" for="nl-email">Email address</label>
      <input id="nl-email" type="email" name="email" placeholder="Enter your email" required>
      <button class="btn btn-primary" type="submit">Subscribe</button>
      <p class="nl-small">No spam, ever. Unsubscribe anytime.</p>
      <p class="nl-status" role="status" aria-live="polite"></p>
    </form>
  </div>
</section>
